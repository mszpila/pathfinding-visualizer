<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="cssTheme" rel="stylesheet" href="cssBasic.css"/>
    <title>Pathfinding Visualiser with A* algorithm</title>
</head>
<body>
    <div class="navbarDiv">
        <nav class="navbar">
            <div class="navbarHeader">
                <div class="title">Pathfinding Visualiser</div>
            </div>
            <div class="items">
                <ul class="navbarItems">
                    <li onclick="clearFunction(); runAStartAlgorithm()" class="button">Start
                    <li onclick="clearBoard()" class="button">Clear Board
                    <li onclick="clearFunction()" class="button">Clear Path
                </ul>
            </div>
        </nav>
    </div>
    <div class="legendDiv">
    </div>
    <div class="description">
        Build your maze and click Start
    </div>
    <table id="board"></table>
</body>
    <script>
        function toggleDropdown(element) {
            for (const dropdown of document.getElementsByClassName('dropdownMenu')) {
                if (dropdown.id !== element) {
                    dropdown.classList.remove('show');
                }
            }
            document.getElementById(element).classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropOk')) {
                for (const dropdown of document.getElementsByClassName('dropdownMenu')) {
                    dropdown.classList.remove('show');
                }
            }
        }
    </script>
    <script>
        const ROWS = 18;
        const COLS = 50;
        const STEP_MS = 10;
        const WEIGHT = 15;

        let start = '10-7';
        let end = '10-42';
        let walls = [];
        let weights = [];

        let isPressed = false;
        let typeOfNode = '';
        let algoClicked = false;
        let wKeyPressed = false;

        let visited = [];
        let path = [];
        let reachedGoal = false;

        const cellId = (y, x) => `${y}-${x}`;

        const parseId = (id) => id.split('-').map(Number);

        const heuristic = (id, target) => {
            const [y1, x1] = parseId(id);
            const [y2, x2] = parseId(target);
            return Math.abs(y1 - y2) + Math.abs(x1 - x2);
        };

        function Node(yx, previousNode, score, gScore, toEndScore, isWall, weight) {
            this.yx = yx;
            this.previousNode = previousNode;
            this.score = score;
            this.gScore = gScore;
            this.toEndScore = toEndScore;
            this.isWall = isWall;
            this.weight = weight;
        }

        const createNode = (yx, previousNode, gScore, target, weight = 1) => {
            const h = heuristic(yx, target);
            return new Node(yx, previousNode, gScore + h, gScore, h, false, weight);
        };

        const getNeighbours = (id, rows, cols) => {
            const [y, x] = parseId(id);
            return [[y, x + 1], [y, x - 1], [y + 1, x], [y - 1, x]]
                .filter(([ny, nx]) => ny >= 0 && ny < rows && nx >= 0 && nx < cols)
                .map(([ny, nx]) => cellId(ny, nx));
        };

        const pickBestNode = (nodes) => {
            const lowestScore = Math.min(...nodes.map(node => node.score));
            const candidates = nodes.filter(node => node.score === lowestScore);
            const lowestEndScore = Math.min(...candidates.map(node => node.toEndScore));
            return candidates.find(node => node.toEndScore === lowestEndScore);
        };

        const buildPath = (lastNode) => {
            const result = [];
            for (let node = lastNode; node !== null; node = node.previousNode) {
                result.push(node.yx);
            }
            return result.reverse();
        };

        const aStar = ({ start, end, rows, cols, isWall, getWeight }) => {
            const toVisit = [createNode(start, null, 0, end)];
            const closed = [];

            while (toVisit.length) {
                const current = pickBestNode(toVisit);
                toVisit.splice(toVisit.findIndex(node => node.yx === current.yx), 1);
                closed.push(current);

                if (current.yx === end) {
                    return { visited: closed, path: buildPath(current), reachedGoal: true };
                }

                for (const neighbourId of getNeighbours(current.yx, rows, cols)) {
                    if (isWall(neighbourId) || closed.some(node => node.yx === neighbourId)) {
                        continue;
                    }

                    const weight = getWeight(neighbourId);
                    const gScore = current.gScore + weight;
                    const existing = toVisit.find(node => node.yx === neighbourId);

                    if (!existing) {
                        toVisit.push(createNode(neighbourId, current, gScore, end, weight));
                    } else if (gScore < existing.gScore) {
                        existing.previousNode = current;
                        existing.gScore = gScore;
                        existing.score = gScore + existing.toEndScore;
                    }
                }
            }

            return { visited: closed, path: [], reachedGoal: false };
        };

        const getCell = (id) => document.getElementById(id);

        const createBoard = () => {
            const table = document.getElementById('board');
            for (let r = 0; r < ROWS; r++) {
                const row = table.insertRow(-1);
                row.setAttribute('id', 'row ' + r);
                for (let c = 0; c < COLS; c++) {
                    const cell = row.insertCell(-1);
                    cell.setAttribute('id', cellId(r, c));
                    if (cell.id !== start && cell.id !== end) {
                        cell.classList.add('unvisited');
                    }
                }
            }
            getCell(start).classList.add('start');
            getCell(end).classList.add('end');
        };

        const isWallCell = (id) => getCell(id).classList.contains('wall');

        const getCellWeight = (id) => getCell(id).classList.contains('weighted') ? WEIGHT : 1;

        const paintVisitedCell = (id) => {
            const cell = getCell(id);
            if (cell.className === 'unvisited') {
                cell.classList.remove('unvisited');
                cell.classList.add('visited');
            } else if (cell.className === 'start' || cell.className === 'unvisited end' || cell.className === 'weighted') {
                cell.classList.add('visited');
            }
        };

        const paintPathCell = (id) => getCell(id).classList.add('path');

        const animateResult = (visited, path, reachedGoal) => {
            visited.forEach((node, i) => {
                setTimeout(() => paintVisitedCell(node.yx), STEP_MS * i);
            });
            if (reachedGoal) {
                path.forEach((id, i) => {
                    setTimeout(() => paintPathCell(id), STEP_MS * (visited.length + i));
                });
            }
        };

        const drawResult = (visited, path, reachedGoal) => {
            visited.forEach(node => paintVisitedCell(node.yx));
            if (reachedGoal) {
                path.forEach(paintPathCell);
            }
        };

        const validateWalls = () => {
            walls.map(getCell).forEach(cell => {
                if (cell.className === 'unvisited' || cell.className === 'visited') {
                    cell.classList.remove('unvisited', 'visited');
                    cell.classList.add('wall');
                }
            });
        };

        const validateWeights = () => {
            weights.map(getCell).forEach(cell => {
                if (!isStartOrEnd(cell) && !cell.classList.contains('weighted')) {
                    cell.classList.remove('unvisited');
                    cell.classList.add('weighted');
                }
            });
        };

        const clearFunction = () => {
            visited.forEach(node => {
                const cell = getCell(node.yx);
                if (cell.classList.contains('visited') && !cell.classList.contains('start')) {
                    cell.classList.remove('visited');
                    if (!cell.classList.contains('weighted')) {
                        cell.classList.add('unvisited');
                    }
                } else if (cell.classList.contains('start')) {
                    cell.classList.remove('visited');
                }
                cell.classList.remove('path');
            });
            visited = [];
            path = [];
            algoClicked = false;
            reachedGoal = false;
        };

        const clearBoard = () => {
            clearFunction();
            walls.map(getCell).forEach(cell => {
                if (cell.classList.contains('wall')) {
                    cell.classList.remove('wall');
                    cell.classList.add('unvisited');
                }
            });
            walls = [];
            weights.map(getCell).forEach(cell => {
                if (cell.classList.contains('weighted')) {
                    cell.classList.remove('weighted');
                    cell.classList.add('unvisited');
                }
            });
            weights = [];
        };

        const startAlgorithm = (instant = false) => {
            algoClicked = true;
            ({ visited, path, reachedGoal } = aStar({ start, end, rows: ROWS, cols: COLS, isWall: isWallCell, getWeight: getCellWeight }));
            if (instant) {
                drawResult(visited, path, reachedGoal);
            } else {
                animateResult(visited, path, reachedGoal);
            }
        };

        const runAStartAlgorithm = () => startAlgorithm();

        const addWall = (id) => {
            if (!walls.includes(id)) {
                walls.push(id);
            }
        };

        const removeWall = (id) => {
            if (walls.includes(id)) {
                walls.splice(walls.indexOf(id), 1);
            }
        };

        const addWeight = (id) => {
            if (!weights.includes(id)) {
                weights.push(id);
            }
        };

        const removeWeight = (id) => {
            if (weights.includes(id)) {
                weights.splice(weights.indexOf(id), 1);
            }
        };

        const setWeighted = (cell) => {
            cell.classList.remove('wall', 'unvisited');
            cell.classList.add('weighted');
            removeWall(cell.id);
            addWeight(cell.id);
        };

        const isDraggingStart = () => typeOfNode === 'start' || typeOfNode === 'start visited path';

        const isDraggingEnd = () => typeOfNode === 'end' || typeOfNode === 'end path';

        const isStartOrEnd = (cell) => cell.classList.contains('start') || cell.classList.contains('end');

        const onMouseDown = (event) => {
            event.preventDefault();
            const cell = event.currentTarget;
            typeOfNode = cell.className;

            if (wKeyPressed && !isStartOrEnd(cell)) {
                typeOfNode = 'weight';
                if (cell.classList.contains('weighted')) {
                    cell.classList.remove('weighted');
                    if (!cell.classList.contains('visited')) {
                        cell.classList.add('unvisited');
                    }
                    removeWeight(cell.id);
                } else {
                    setWeighted(cell);
                }
            } else if (cell.classList.contains('unvisited')) {
                cell.classList.remove('unvisited');
                cell.classList.add('wall');
                addWall(cell.id);
            } else if (cell.classList.contains('wall')) {
                cell.classList.remove('wall');
                cell.classList.add('unvisited');
                removeWall(cell.id);
            } else if (cell.classList.contains('visited') && !cell.classList.contains('start')) {
                typeOfNode = 'visited';
                cell.classList.remove(...cell.classList);
                cell.classList.add('wall');
                addWall(cell.id);
                removeWeight(cell.id);
            } else if (cell.classList.contains('weighted')) {
                typeOfNode = 'unvisited';
                cell.classList.remove('weighted');
                cell.classList.add('wall');
                addWall(cell.id);
                removeWeight(cell.id);
            }

            isPressed = true;
        };

        const onMouseUp = () => {
            isPressed = false;
        };

        const onMouseLeave = (event) => {
            if (!isPressed) {
                return;
            }
            const cell = event.currentTarget;
            const marker = isDraggingStart() ? 'start' : isDraggingEnd() ? 'end' : null;
            if (marker) {
                cell.classList.remove(marker);
                cell.classList.add('unvisited');
                validateWalls();
                validateWeights();
            }
        };

        const moveMarker = (cell, marker) => {
            cell.classList.remove('wall', 'unvisited', 'weighted');
            cell.classList.add(marker);
            if (marker === 'start') {
                start = cell.id;
            } else {
                end = cell.id;
            }
            if (algoClicked) {
                clearFunction();
                startAlgorithm();
            }
            validateWalls();
            validateWeights();
        };

        const onMouseEnter = (event) => {
            if (!isPressed) {
                return;
            }
            const cell = event.currentTarget;

            if (isDraggingStart()) {
                moveMarker(cell, 'start');
            } else if (isDraggingEnd()) {
                moveMarker(cell, 'end');
            } else if (typeOfNode === 'weight') {
                if (!isStartOrEnd(cell)) {
                    setWeighted(cell);
                }
            } else if (['unvisited', 'visited', 'visited path'].includes(typeOfNode)) {
                if (!isStartOrEnd(cell)) {
                    cell.classList.remove(...cell.classList);
                    cell.classList.add('wall');
                    addWall(cell.id);
                    removeWeight(cell.id);
                }
            } else if (typeOfNode === 'wall') {
                if (!isStartOrEnd(cell)) {
                    cell.classList.remove('wall');
                    cell.classList.add('unvisited');
                    removeWall(cell.id);
                }
            }
        };

        const addEvents = () => {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = getCell(cellId(r, c));
                    cell.onmousedown = onMouseDown;
                    cell.onmouseup = onMouseUp;
                    cell.onmouseleave = onMouseLeave;
                    cell.onmouseenter = onMouseEnter;
                }
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'w') {
                wKeyPressed = true;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.key.toLowerCase() === 'w') {
                wKeyPressed = false;
            }
        });

        createBoard();
        addEvents();
    </script>
</html>
